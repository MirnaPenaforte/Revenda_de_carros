{% extends 'base.html' %} {% block content %}
 <style>
  
    .car-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px; 
      margin: 0 auto;
    }

  
    .car-card {
      background-color: #fff; 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      height: 100%; 
    }

    .car-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    
    .photo-container {
      width: 100%;
      height: 200px;
      background-color: #ddd; 
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    
    .car-card h2 {
      font-size: 1.25rem;
      color: #494848;
      margin: 15px 10px 5px;
      text-decoration: none;
    }

    .car-card p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 15px;
      text-decoration: none;
    }
     
    a{
      text-decoration: none;
    }

    
    .search-container {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
    }

    input[type="text"] {
        padding: 10px 15px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px 0 0 4px; /* Arredonda apenas o lado esquerdo */
        width: 300px;
    }

    button[type="submit"] {
        background-color: #343535; /* Azul padrão do hover do menu */
        color: #fff;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 0 4px 4px 0; /* Arredonda apenas o lado direito */
        cursor: pointer;
        transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
        background-color: #108eb8;
    }

    
    @media (max-width: 992px) {
      .car-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .car-grid { grid-template-columns: 1fr; }
    }
  </style>

  <div class="search-container">
    <form method="GET" action="{% url 'cars_list' %}">
      <input type="text" name="search" placeholder="Buscar carro...">
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="car-grid">
    {% if cars %}
      {% for car in cars %}
        <a href="{% url 'car_detail' car.pk %}">
          <div class="car-card">
            <div class="photo-container">
              {% if car.photo %}
                <img src="{{ car.photo.url }}" alt="{{ car.model }}">
              {% else %}
                <span style="color: #888;">Sem foto</span>
              {% endif %}
            </div>

            <h2>{{ car.brand }} {{ car.model }}</h2>
            <p>{{ car.factory_year }} — R$ {{ car.value }}</p>
  
          </div>
        </a>
      {% endfor %}
    {% else %}
      <p style="grid-column: 1 / -1; text-align: center;">Nenhum carro encontrado.</p>
    {% endif %}
  </div>
{% endblock %}
